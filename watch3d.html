// ------------------------------------------------------------------ transport (standalone page)
const playBtn = $("#play");
function setPlaying(p) { playing = p; playBtn.setAttribute("aria-label", p ? "Pause" : "Play"); $("#playIcon").innerHTML = p ? '<rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/>' : '<path d="M2 1 L11 6 L2 11 Z"/>'; }
playBtn.addEventListener("click", () => setPlaying(!playing));
window.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); } });
const bar = $("#bar");
function scrub(ev) { if (!cur) return; const r = bar.getBoundingClientRect(), f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); const nc = f * cur.total; if (nc < clk) clearGhosts(); clk = nc; hold = 0; setPlaying(false); }
bar.addEventListener("pointerdown", e => { bar.setPointerCapture(e.pointerId); scrub(e); bar.onpointermove = scrub; });
bar.addEventListener("pointerup", () => { bar.onpointermove = null; });
setPlaying(playing);

// ------------------------------------------------------------------ clip loading
const clipsEl = $("#clips");
CLIPS.forEach((c, i) => { const b = document.createElement("button"); b.innerHTML = `${c.name}<small>${c.tag}</small>`; b.setAttribute("aria-pressed", "false"); b.dataset.key = c.key; b.addEventListener("click", () => { press(clipsEl, b); load(c.key); }); clipsEl.appendChild(b); });
window.__gtfState = () => ({ key: cur && cur.key, t: st.t, k: st.k, u: st.u, fut, ctx: !!(cur && cur.ctx), ctxFrame: cur && cur.ctx ? cur.ctx.shown : -1, still: !!(cur && cur.stillReady), renders, onscreen });  // read-only probe for automated checks
// capture mode (teaser renders): set the clock directly, render one frame, report back
window.__gtfSeek = c => { if (!cur) return false; if (c < clk) clearGhosts(); clk = c; st = stateAtClock(clk); render_state(st); if (view === "sway") { swayT = c; sway(0); } renderer.render(scene, camera); return true; };
// scripted camera for the teaser (capture mode): relative to the clip's home view (the original camera). az/el in degrees
// about the orbit target, r scales the distance, f moves the target from the principal axis (f = 0: the home view is the
// original camera) towards the object's mean position (f = 1); applied at the next __gtfSeek
const focusOf = c => { const ps = c.futures[0].obj || [], v = new THREE.Vector3(); ps.forEach(q => v.add(q.p)); return ps.length ? v.multiplyScalar(1 / ps.length) : c.target.clone(); };
window.__gtfCam = p => {
  if (!cur) return false; view = "script";
  if (!cur.focus) cur.focus = focusOf(cur);
  const tgt = cur.target.clone().lerp(cur.focus, p.f || 0);
  const sph = new THREE.Spherical().setFromVector3(cur.home.clone().sub(cur.target));
  sph.theta += THREE.MathUtils.degToRad(p.az || 0); sph.phi = Math.min(Math.PI - 0.05, Math.max(0.05, sph.phi - THREE.MathUtils.degToRad(p.el || 0))); sph.radius *= p.r || 1;
  camera.position.copy(tgt).add(new THREE.Vector3().setFromSpherical(sph)); camera.up.set(0, 1, 0); camera.lookAt(tgt);
  return true;
};
window.__gtfFuture = k => { if (!cur) return false; if (k !== fut) setFuture(k, true); return cur.futures.length; };
// distance (mm) between the head of the drawn path and the object's centre right now (automated check of the path timing)
window.__gtfPathGap = () => { if (!cur || !cur.tube || !cur.tube.visible) return null; const c = cur.curves[fut], m = cur.meta, [i, j, u] = frameAt(m.times, Math.max(0, st.t)), N = m.times.length - m.t_freeze_index; const tp = Math.max(0, Math.min(1, ((i - m.t_freeze_index) + u * (j - i)) / Math.max(1, N - 1))); const head = c.getPointAt(Math.min(1, cur.tube.geometry.drawRange.count / (8 * 6) / cur.tubeSeg)); return head.distanceTo(c.getPoint(tp)) * 1000; };
window.__gtfInfo = () => cur ? { key: cur.key, total: cur.total, segs: cur.segs, stillReady: cur.stillReady, ctxReady: !cur.meta.ctx || !!(cur.ctx && cur.ctx.complete), ctxFailed: cur.ctxFailed, futures: cur.futures.length, mode: cur.meta.mode || "forecast" } : null;
window.__gtfLoad = key => new Promise(res => { const ok = () => { if (cur && cur.key === key && !loadingKey && cur.stillReady && (!cur.meta.ctx || (cur.ctx && cur.ctx.complete) || cur.ctxFailed)) res(window.__gtfInfo()); else setTimeout(ok, 50); }; if ((!cur || cur.key !== key) && loadingKey !== key) load(key); ok(); });
function applyExternal(m) {
  if (!cur || cur.key !== m.key) return;
  if (m.future !== undefined && m.future !== fut && m.future < cur.futures.length) setFuture(m.future, true);
  if (m.t < st.t - 1e-3 || (m.k === "pre" && st.k !== "pre")) clearGhosts();
  st = { k: m.k || (m.t < cur.meta.observed_s ? "obs" : "pred"), t: m.t, u: m.u || 0, fut };
}
window.addEventListener("message", ev => {
  const m = ev.data || {};
  if (m.type === "gtf3d-state") { if (!cur || cur.key !== m.key) { pendingState = m; if (loadingKey !== m.key) load(m.key); } else applyExternal(m); }
  else if (m.type === "gtf3d-view") { if (m.v !== view) setView(m.v); }
});
function load(key) {
  loadingKey = key;
  $("#loading").classList.remove("off");
  const b = clipsEl.querySelector(`button[data-key="${key}"]`); if (b) press(clipsEl, b);
  const go = () => { build(key); loadingKey = null; $("#loading").classList.add("off"); setView(view === "orbit" && !EMBED ? "sway" : view); if (pendingState && pendingState.key === key) { applyExternal(pendingState); pendingState = null; } if (EMBED && window.parent !== window) window.parent.postMessage({ type: "gtf3d-ready", key }, "*"); };
  if (window.GTF3D[key]) return go();
  const s = document.createElement("script"); s.src = `${BASE}/${key}/data.js`;
  s.onerror = () => { $("#loading").textContent = "could not load " + key; };
  document.addEventListener("gtf3d", function h(ev) { if (ev.detail === key) { document.removeEventListener("gtf3d", h); go(); } });
  document.head.appendChild(s);
}
$("#pipBtn").addEventListener("click", () => $("#pip").classList.toggle("big"));

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
// embedded in the page, the stage stops drawing while it is scrolled out of view (inside an iframe the observer measures
// against the page's viewport); the page's other videos and the visitor's CPU get that time back
let onscreen = true, renders = 0;
new IntersectionObserver(es => { onscreen = es[es.length - 1].isIntersecting; }).observe(document.documentElement);
function loop() {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!onscreen) { requestAnimationFrame(loop); return; }
  if (cur && !Q.has("capture")) {
    if (!EMBED) {
      if (playing) { if (clk >= cur.total) { hold += dt; if (hold > 0.6) { clk = 0; hold = 0; clearGhosts(); } } else clk = Math.min(cur.total, clk + dt); }
      st = stateAtClock(clk); hud();
    }
    render_state(st);
    if (view === "sway" && !reduce) sway(dt);
    if (view === "orbit") controls.update();
  }
  if (!Q.has("capture")) { renderer.render(scene, camera); renders++; }
  requestAnimationFrame(loop);
}
resize(); load(Q.get("clip") || CLIPS[0].key); loop();
</script>
</body>
</html>
